# Integracion continua en push y pull request.
#
# Hasta ahora el unico workflow del repositorio se disparaba con tags y solo
# compilaba los binarios: ni lint, ni tests, ni la API. Por eso un build roto
# con cinco errores de TypeScript convivio con una release publicada sin que
# nada lo señalara.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un push que llega mientras corre el anterior cancela al viejo: nadie necesita
# el resultado de un commit ya superado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Las acciones van pineadas por SHA y no por tag. Un tag como @v4 es movil: quien
# controle el repositorio de la accion puede reapuntarlo y ejecutar codigo nuevo
# en este workflow sin que aqui cambie una linea. El comentario al lado de cada
# SHA dice a que version corresponde, para poder actualizarlas a conciencia.

jobs:
  desktop:
    name: Desktop (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test:run

      # Compila `tsc -b && vite build`, que es exactamente lo que ejecuta
      # `beforeBuildCommand` de Tauri: si esto falla, la release tambien.
      - name: Build
        run: pnpm build

  api:
    name: API (check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run check

      - name: Build
        run: bun run build

  # Verifica que el camino documentado en el README funciona de verdad: clonar,
  # levantar el compose, aplicar TODAS las migraciones y responder. Es el paso
  # que habria detectado que el quick start aplicaba solo la migracion 0000.
  self-hosting:
    name: Self-hosting quick start
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create .env from example
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci_test_password/" .env
          sed -i "s|YOUR_SECURE_PASSWORD|ci_test_password|g" .env
          echo "MASTER_API_KEY=$(openssl rand -hex 32)" >> .env

      - name: Start services
        run: docker compose up -d --build

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 2
          done
          echo "API never became healthy" >&2
          docker compose logs --tail=50
          exit 1

      - name: Apply migrations
        run: docker compose exec -T api bun run db:migrate

      # Creates the first API key from MASTER_API_KEY. Without this the
      # api_keys table is empty and every authenticated request gets 401.
      - name: Seed
        run: docker compose exec -T api bun run dist/db/seed.js

      # Sin la migracion 0001 este endpoint devuelve error: las rutas de CVs
      # consultan columnas que solo esa migracion crea.
      - name: CV routes answer (regression guard for migration 0001)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "X-API-Key: $(grep '^MASTER_API_KEY=' .env | cut -d= -f2)" \
            http://localhost:3000/api/cvs)
          echo "GET /api/cvs -> $code"
          [ "$code" = "200" ] || { docker compose logs --tail=50 api; exit 1; }

      - name: Stop services
        if: always()
        run: docker compose down -v
